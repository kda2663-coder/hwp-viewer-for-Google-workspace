<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG 뷰어 품질 테스트</title>
  <style>
    body { margin: 0; font-family: "맑은 고딕", system-ui, sans-serif; background: #525659; color: #fff; }
    #bar { padding: 10px 14px; background: #1f2937; display: flex; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 10; }
    #bar button { padding: 7px 12px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: 13px; }
    #bar span { font-size: 12px; color: #cbd5e1; }
    #pages { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .page { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.4); max-width: 100%; }
    .page svg { display: block; max-width: 100%; height: auto; }
    #log { font: 11px/1.5 ui-monospace, monospace; color: #d1fae5; padding: 8px 14px; white-space: pre-wrap; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="btnOpen">📂 hwp 파일 선택</button>
    <span id="info">로컬 hwp/hwpx 파일을 골라 SVG 렌더링 품질을 확인합니다</span>
  </div>
  <input type="file" id="file" accept=".hwp,.hwpx" style="display:none" />
  <div id="log"></div>
  <div id="pages"></div>

  <script type="module">
    import { createEditor } from 'https://esm.sh/@rhwp/editor@0.7.13';

    const $ = (id) => document.getElementById(id);
    const logEl = $('log'), pagesEl = $('pages'), infoEl = $('info');
    function log(m, err) { const d = document.createElement('div'); if (err) d.className = 'err'; d.textContent = m; logEl.appendChild(d); }

    let editor = null;
    async function ensureEditor() {
      if (editor) return editor;
      // 편집기 인스턴스를 화면 밖에 만들어 hwp 해석 엔진만 사용 (편집 UI는 안 보임)
      const holder = document.createElement('div');
      holder.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden';
      holder.id = 'hidden-editor';
      document.body.appendChild(holder);
      log('rhwp 엔진 로딩 중…');
      editor = await createEditor('#hidden-editor');
      log('rhwp 엔진 준비 완료 ✓');
      return editor;
    }

    $('btnOpen').addEventListener('click', () => $('file').click());
    $('file').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      pagesEl.innerHTML = ''; logEl.innerHTML = '';
      try {
        const ed = await ensureEditor();
        const t0 = performance.now();
        const buf = new Uint8Array(await f.arrayBuffer());
        log(`파일: ${f.name} (${buf.length} bytes) loadFile…`);
        const res = await ed.loadFile(buf, f.name);
        const n = res?.pageCount || await ed.pageCount();
        const tLoad = Math.round(performance.now() - t0);
        log(`해석 완료: ${n}페이지 (${tLoad}ms)`);
        infoEl.textContent = `${f.name} — ${n}페이지`;

        for (let i = 1; i <= n; i++) {
          const tp = performance.now();
          const svg = await ed.getPageSvg(i);
          const dt = Math.round(performance.now() - tp);
          const wrap = document.createElement('div');
          wrap.className = 'page';
          wrap.innerHTML = svg;
          pagesEl.appendChild(wrap);
          log(`  ${i}페이지 SVG: ${svg.length} bytes (${dt}ms)`);
        }
        log(`완료 — 총 ${Math.round(performance.now() - t0)}ms`);
      } catch (err) {
        log('오류: ' + (err?.message || err), true);
        console.error(err);
      } finally {
        e.target.value = '';
      }
    });
  </script>
</body>
</html>
